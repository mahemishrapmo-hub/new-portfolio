# Builds the site on every pull request so a broken page never reaches main.
name: Build check

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the synthetic data engine
        run: python -m unittest discover -s scripts/synthetic -p 'test_*.py'

      - run: npm ci
      - run: npm run build
